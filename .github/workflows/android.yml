name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: test and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # `secrets` cannot be read from an `if:`; bounce it through env.
      HAS_KEYSTORE: ${{ secrets.SHUNYA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # A tampered gradle-wrapper.jar is the easiest thing to smuggle into a
      # pull request. Check it against Gradle's published checksums first.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          SHUNYA_KEYSTORE_BASE64: ${{ secrets.SHUNYA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SHUNYA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SHUNYA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: unit tests and release apk
        env:
          SHUNYA_KEYSTORE_PASSWORD: ${{ secrets.SHUNYA_KEYSTORE_PASSWORD }}
          SHUNYA_KEY_ALIAS: ${{ secrets.SHUNYA_KEY_ALIAS }}
          SHUNYA_KEY_PASSWORD: ${{ secrets.SHUNYA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - name: name the apk
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) suffix="$GITHUB_REF_NAME" ;;
            *)           suffix="${GITHUB_SHA::7}" ;;
          esac
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/shunya-$suffix.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: shunya-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: say how it was signed
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "signed with the release keystore"
          else
            echo "::warning::SHUNYA_KEYSTORE_BASE64 is not set — the apk is signed with a throwaway debug key and will not update an existing install"
          fi

  release:
    name: github release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shunya-apk
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            **Install:** download the `.apk` below and open it on the phone. Allow installs from your browser or files app when Android asks, then **Settings → Apps → Default apps → Home app → Shunya**.
